[workspace]
resolver = "3"
members = ["algo", "cli", "webgraph"]
# Exclude the fuzzing workspace from the main workspace, since it is not meant 
# to be built by default, nor run with `cargo t --all-targets`.
exclude = ["webgraph/fuzz"]

[workspace.dependencies]
webgraph = { path = "./webgraph", version = "0.6.1" }
webgraph-algo = { path = "./algo", version = "0.6.1" }
webgraph-cli = { path = "./cli" }

card-est-array = "0.6.0"
epserde = "0.13.1"
dsi-bitstream = "0.10.1"
dsi-progress-logger = "0.8.9"
#sux = { version = "0.14.0", features = ["epserde", "rayon", "mmap"] }
sux = { git = "https://github.com/vigna/sux-rs", features = ["epserde", "rayon", "mmap"] }
dary_heap = "0.3.9"
num-traits = { version = "0.2.19", default-features = false }
lender = "0.8.0"
log = "0.4.34"
anyhow = { version = "1.0.104", features = ["backtrace"] }
rand = "0.10.3"
tempfile = "3.27.0"
itertools = "0.15.0"
rayon = "1.12.0"
mmap-rs = "0.7.0"
predicates = "3.1.4"
java-properties = "2.0.0"
env_logger = { version = "0.11.11", default-features = false, features = [
    "auto-color",
    "regex",
] }
clap = { version = "4.6.7", features = ["derive", "string", "wrap_help"] }
sync-cell-slice = "0.9.14"
arbitrary = { version = "1.5.0", features = ["derive"] }
serde = { version = "1.0.229", features = ["serde_derive"] }
serde_json = "1.0.152"
zstd = "0.14.2"
num-primitive = ">=0.2.1, <0.4"
value-traits = "0.3.1"
thiserror = "2.0.21"
no-break = "0.2.1"
nonmax = "0.5.5"
crossbeam-utils = "0.8.23"
sysinfo = ">=0.35.0, <0.40"
funcperm = "0.2.2"

[profile.release]
opt-level = 3 # like --release
#lto = "fat"              # Full LTO
overflow-checks = false  # Disable integer overflow checks.
debug = true             # Include debug info.
debug-assertions = false # Enables debug assertions.
#codegen-units = 1        # slower compile times, but maybe better perf

[profile.bench]
opt-level = 3            # like --release
lto = "fat"              # Full LTO
overflow-checks = false  # Disable integer overflow checks.
debug = true             # Include debug info.
debug-assertions = false # Enables debug assertions.
codegen-units = 1        # slower compile times, but maybe better perf
